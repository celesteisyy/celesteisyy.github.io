name: Playground authentication

on:
  push:
    branches: [main, codex/cognito-login]
    paths: ["playground/**", ".github/workflows/playground-auth.yml"]
  pull_request:
    paths: ["playground/**", ".github/workflows/playground-auth.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check playground/app.js
      - run: node --check playground/auth.js
      - run: node --test playground/tests/auth.test.cjs
