name: Playground checks

on:
  push:
    branches: [main, codex/cognito-login]
    paths: ["playground/**", ".github/workflows/playground-auth.yml"]
  pull_request:
    paths: ["playground/**", ".github/workflows/playground-auth.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check playground/webui.js
      - run: bash -n playground/deploy/install.sh
      - run: node --test playground/tests/csp.test.cjs
      - name: Nginx static route checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          python3 playground/tests/nginx.test.py
      - name: Workspace browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/cyssie-browser" --no-save --package-lock=false playwright@1.64.0
          "$RUNNER_TEMP/cyssie-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          NODE_PATH="$RUNNER_TEMP/cyssie-browser/node_modules" node --test playground/tests/browser.test.cjs
