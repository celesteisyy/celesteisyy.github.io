<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selected Work | Celeste Huang</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f7f8fc; --surface:rgba(255,255,255,.78); --card:rgba(255,255,255,.9);
      --text:#172033; --muted:#667089; --border:rgba(23,32,51,.1);
      --primary:#5b7cff; --primary-soft:rgba(91,124,255,.1);
      --shadow:0 10px 30px rgba(27,39,78,.08);
    }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#0b1020; --surface:rgba(255,255,255,.06); --card:rgba(255,255,255,.08); --text:#e8eefc; --muted:#a8b2ca; --border:rgba(255,255,255,.1); --primary:#8aa2ff; --primary-soft:rgba(138,162,255,.14); --shadow:0 10px 30px rgba(0,0,0,.28); }
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { width:100%; height:100%; }
    body { background:radial-gradient(circle at 15% 18%,var(--primary-soft),transparent 28%),var(--bg); color:var(--text); font-family:"Segoe UI",Arial,sans-serif; overflow:hidden; }
    .shell { height:100vh; display:flex; flex-direction:column; gap:12px; padding:14px; }
    .topbar { flex:0 0 auto; min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 16px; border:1px solid var(--border); border-radius:24px; background:var(--surface); box-shadow:var(--shadow); backdrop-filter:blur(12px); }
    .left { display:flex; align-items:center; gap:14px; min-width:0; }
    .home { width:44px; height:44px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:50%; background:var(--card); color:var(--text); text-decoration:none; box-shadow:var(--shadow); transition:.2s ease; }
    .home:hover { transform:translateY(-1px); color:var(--primary); background:var(--primary-soft); }
    .title { min-width:0; }
    h1 { font-size:clamp(1.25rem,3vw,1.7rem); line-height:1.15; letter-spacing:-.03em; white-space:nowrap; }
    .title p { margin-top:3px; color:var(--muted); font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tag { display:inline-flex; align-items:center; gap:8px; padding:9px 13px; border:1px solid var(--border); border-radius:999px; background:var(--card); color:var(--muted); font-size:.88rem; }
    .notion { flex:1 1 auto; min-height:0; overflow:hidden; border:1px solid var(--border); border-radius:24px; background:white; box-shadow:var(--shadow); }
    iframe { display:block; width:100%; height:100%; border:0; background:white; }
    @media (max-width:720px) { .shell { padding:10px; gap:10px; } .topbar { min-height:68px; padding:10px 12px; border-radius:20px; } .home { width:42px; height:42px; } .tag { display:none; } .notion { border-radius:20px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="left">
        <a class="home" href="/" aria-label="Return to home" title="Return to home"><i class="fa-solid fa-house"></i></a>
        <div class="title">
          <h1>Selected Work</h1>
          <p>Application security, architecture review, and AI security.</p>
        </div>
      </div>
      <div class="tag"><i class="fa-solid fa-shield-halved"></i><span>Projects &amp; case studies</span></div>
    </header>
    <main class="notion">
      <iframe src="https://celesteisyy.notion.site/ebd//3bacc5022b0381d18e95f429002dfbbc" allowfullscreen title="Celeste Huang selected work"></iframe>
    </main>
  </div>
</body>
</html>
