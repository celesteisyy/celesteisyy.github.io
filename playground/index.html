<body>
  <div class="nav-wrap">
    <nav>
      <a class="brand" href="/playground/">Cyssie</a>

      <div class="nav-links">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/blogs/">Blogs</a>
        <a class="nav-link" href="https://www.linkedin.com/in/yueying-huang/" target="_blank" rel="noreferrer">LinkedIn</a>
      </div>
    </nav>
  </div>

  <main class="container">
    <section class="workspace">
      <aside class="sidebar" id="sessionSidebar">
        <div class="sidebar-head">
          <span class="eyebrow">Tiny AI Agent</span>
          <h1>Cyssie Playground</h1>
          <p>A quiet workspace for asking, testing, and building with Cyssie.</p>
        </div>

        <div class="sidebar-actions">
          <button class="primary-btn" id="newChatButton" type="button">New chat</button>
          <button id="tokenButton" type="button">Sign in</button>
        </div>

        <div class="sessions" id="sessions"></div>

        <div class="sidebar-foot">
          Conversations are saved locally in this browser.
        </div>
      </aside>

      <button
        class="sidebar-toggle"
        id="sidebarToggle"
        type="button"
        aria-controls="sessionSidebar"
        aria-expanded="true"
        aria-label="Hide sessions"
        title="Hide sessions"
      >
        <span class="sidebar-toggle-icon" aria-hidden="true"></span>
        <span class="sr-only">Hide sessions</span>
      </button>

      <section class="chat-shell">
        <div class="chat-topbar">
          <div class="topbar-start">
            <div class="window-dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
          <div class="chat-title" id="activeTitle">cyssie_session.md</div>
          <div class="top-actions">
            <button class="small-btn" id="clearChatButton" type="button">Clear</button>
            <button class="small-btn" id="deleteChatButton" type="button">Delete</button>
          </div>
        </div>

        <p id="downloadStatus" class="download-status" role="status" aria-live="polite" hidden></p>
        <div id="chat"></div>

        <form class="composer" id="chatForm">
          <textarea id="messageInput" placeholder="Ask Cyssie..." rows="1"></textarea>
          <button class="send-btn" id="sendButton" type="submit">Send</button>
        </form>
      </section>
    </section>
  </main>

  <div class="token-modal" id="tokenModal" role="dialog" aria-labelledby="authTitle">
    <div class="modal-card">
      <h2 id="authTitle">Sign in</h2>
      <p id="authDescription" role="status" aria-live="polite">Connecting to Cyssie…</p>
      <input id="tokenInput" type="password" placeholder="Bearer token" aria-label="Access token" hidden />
      <button class="primary-btn" id="saveTokenButton" type="button" disabled>Connecting…</button>
    </div>
  </div>
