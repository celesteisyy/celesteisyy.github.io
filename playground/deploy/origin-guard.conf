# http{} context; declared maps have no effect on unrelated virtual hosts.
map $http_origin $cyth_embed_origin_allowed {
    default 0;
    "https://cyth.18-118-248-231.sslip.io" 1;
}
# Safe reads are public or authenticated by the application as before.
# Every write, and every Upgrade request (including WebSocket), needs our origin.
map "$request_method:$http_upgrade" $cyth_embed_sensitive_request {
    default 1;
    ~^(GET|HEAD|OPTIONS):$ 0;
}
map "$cyth_embed_sensitive_request:$cyth_embed_origin_allowed" $cyth_embed_reject_request {
    default 0;
    "1:0" 1;
}
