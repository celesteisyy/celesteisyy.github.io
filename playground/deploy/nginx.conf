# Include only inside cyth's existing HTTPS server{}.
# The http-level maps are installed as /etc/nginx/conf.d/cyth-embed-origin.conf.
# Authentication remains in Open WebUI. This guard supplements cross-site cookies.
if ($cyth_embed_reject_request) { return 403; }
# Inherited by the existing WebUI proxy. Rewrite only the successful, exact
# /auth redirect; OAuth errors/MFA URLs and every credential stay untouched.
proxy_redirect ~^https://cyth\.18-118-248-231\.sslip\.io/auth$ $cyth_embed_login_return;


location = /playground { return 302 /playground/; }
location = /playground/ { rewrite ^ /playground/index.html last; }
location = /playground/embed { return 302 /playground/embed/; }
location = /playground/embed/ { rewrite ^ /playground/embed.html last; }
location = /playground/index.html {
    alias /var/www/cyth-playground/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://celesteisyy.github.io" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /playground/embed.html {
    alias /var/www/cyth-playground/embed.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://celesteisyy.github.io" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /playground/sign-in {
    alias /var/www/cyth-playground/sign-in.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://celesteisyy.github.io" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /playground/login-complete {
    alias /var/www/cyth-playground/login-complete.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://celesteisyy.github.io" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /playground/bootstrap {
    alias /var/www/cyth-playground/bootstrap.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://celesteisyy.github.io" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /playground/webui.css {
    alias /var/www/cyth-playground/webui.css;
    default_type text/css;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /playground/embed.js {
    alias /var/www/cyth-playground/embed.js;
    default_type application/javascript;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
