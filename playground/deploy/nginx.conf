# Include only inside cyth's existing HTTPS server{}.
# Server-level access restrictions continue to apply to these exact paths.
location = /playground {
    return 302 /playground/;
}
location = /playground/index.html {
    return 302 /playground/;
}
location = /playground/ {
    alias /var/www/cyth-playground/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /playground/webui.css {
    alias /var/www/cyth-playground/webui.css;
    default_type text/css;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /playground/webui.js {
    alias /var/www/cyth-playground/webui.js;
    default_type application/javascript;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
